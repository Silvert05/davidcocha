name: CI/CD Pipeline

on:
  push:
    branches: [ "cocha" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-flask

    - name: 🧪 Run tests
      run: pytest tests/ -v

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        # Asegurarse de que la URL del repositorio esté en minúsculas
        tags: ghcr.io/${{ github.repository_owner | toLowerCase }}/cocha:1.0.5

    - name: 🔍 Test SSH connection
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "✅ Conexión exitosa desde GitHub Actions"
          pwd
          whoami
          hostname
          uptime

    - name: 📤 Upload stack.yml to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/automatizar"

    - name: 🚀 Deploy to VPS with Docker Stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /home/${{ secrets.VPS_USER }}/automatizar
          echo "🔄 Desplegando aplicación..."
          docker stack deploy --with-registry-auth -c stack.yml doraemon
          echo "✅ Despliegue completado"
          docker service ls | grep doraemon
